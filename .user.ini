; Production PHP defaults. Keep secrets in server environment variables, never in this file.
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
max_execution_time = 120
max_input_time = 120
memory_limit = 256M
upload_max_filesize = 16M
post_max_size = 16M
